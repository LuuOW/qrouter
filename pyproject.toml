[project]
name        = "qrouter"
version     = "0.0.1"
description = "Quantum natural-language retrieval via DisCoCat + variational circuits"
readme      = "README.md"
license     = { text = "MIT" }
requires-python = ">=3.12"
authors     = [{ name = "lkempe" }]
keywords    = ["qnlp", "quantum", "retrieval", "discocat", "lambeq", "pennylane", "mcp"]

dependencies = [
  # Always-required (the FastAPI wrapper boots even when the quantum
  # stack isn't installed, returning stub responses).
  "numpy>=2.0",
  "fastapi>=0.115",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
# The actual QNLP backend. Heavyweight (~2 GB transitive); install only
# on machines that will run the real ranking. Without these the server
# still answers `/rank` with the unranked fixture + a `mode: "stub"` flag.
qnlp = [
  "lambeq>=0.4",
  "pennylane>=0.39",
  "jax>=0.4",
  "scipy>=1.13",
]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
]
mcp = [
  "mcp>=1.0",
]

[project.scripts]
qrouter         = "qrouter.cli:main"
qrouter-serve   = "qrouter.http_server:main_run"
qrouter-mcp     = "qrouter.mcp_server:main"

[build-system]
requires      = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qrouter"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]   # line length handled by formatter

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts   = "-q --strict-markers"
